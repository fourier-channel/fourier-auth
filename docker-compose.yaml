name: fourier-auth
services:
  auth:
    build: .
    container_name: fourier-auth
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    environment:
      - SYNAPSE_URL=http://synapse:8008
      - REDIS_URL=redis://fourier-redis:6379
      - PORT=8010
      - SESSION_TTL=86400
      - OIDC_ISSUER=https://auth.41chan.net/
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=https://booru.41chan.net/fourier/callback
      - POST_LOGIN_REDIRECT=https://booru.41chan.net/
      - CLIENT_ORIGINS=http://127.0.0.1:5173,https://tc.41chan.net,https://build.tc.41chan.net
      - SYNAPSE_DB_HOST=synapse-postgres-1
      - SYNAPSE_DB_PORT=5432
      - SYNAPSE_DB_NAME=synapse
      - SYNAPSE_DB_USER=fourier_auth_ro
      - SYNAPSE_DB_PASSWORD=${SYNAPSE_DB_PASSWORD}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=matrix-media
      - R2_PRESIGN_TTL=300
      # Imageboard-origin media is public by origin; the BOORU decides which
      # POSTS a viewer sees, and that is the whole gate for these bytes.
      # fourier-auth is uninvolved with archived imageboard media (operator,
      # 2026-09-18). Off = public bytes, the flag the gate was built with.
      - BOORU_MEDIA_REQUIRE_SESSION=0
      # ...and "the booru decides" is now ASKED, per md5, of the booru's own
      # posts API on the docker network (leak audit F-G1, 2026-10-01): no
      # visible post, no bytes -- jailed, deleted and never-posted images 404.
      - BOORU_INTERNAL_URL=http://danbooru:3000
      # Presigned URLs go only to the Cloudflare Worker, which proves itself
      # with this shared secret (F-G2). Same value as the Worker's secret of
      # the same name. In .env, never here.
      - MEDIA_EDGE_SECRET=${MEDIA_EDGE_SECRET}
      # A published page's grant is checked with sampling through Caddy's
      # internal door on this network's gateway (ruling 2026-10-02). Needs the
      # Caddy :5181 block and ops/hetzner/firewall/auth-to-sampling.sh.
      - SAMPLING_INTERNAL_URL=http://172.18.0.1:5181
      # The booru's quarantine (flagged and banished tags; operator rulings
      # 2026-10-12), read as the booru account named in
      # Danbooru.config.fourier_quarantine_reader_names. Both in .env. Unset
      # means every Matrix picture answers 503 (fail closed): set them BEFORE
      # the restart. booru-quarantine.js.
      - BOORU_QUARANTINE_LOGIN=${BOORU_QUARANTINE_LOGIN}
      - BOORU_QUARANTINE_API_KEY=${BOORU_QUARANTINE_API_KEY}
      - HOMESERVER_NAME=41chan.net
      # The sampling console on sample.41chan.net opens to a Matrix user at or
      # above this power level in this room, joined (operator ruling
      # 2026-10-09: the modsmodsmods room, 70 = content moderators). Unset or
      # malformed closes the console (503), never the service. sample-gate.js.
      - SAMPLE_GATE_ROOM=!GgCWjVAknxPyofQtCQ:41chan.net
      - SAMPLE_GATE_LEVEL=70
      # Gate 3 for posts: the placements reader (placements-reader.js). Off
      # until the booru's receiving mode is deployed and
      # tools/ensure-synapse-indexes.sh has built events_gate3_placement_idx
      # and granted SELECT on redactions. On, it pushes as the booru's gate
      # account with a key of its own (fourier_jail:create and :index), both
      # in .env. Any value but on/off keeps it off and red on /healthz.
      - GATE3_READER=off
      - BOORU_PLACEMENTS_LOGIN=${BOORU_PLACEMENTS_LOGIN}
      - BOORU_PLACEMENTS_API_KEY=${BOORU_PLACEMENTS_API_KEY}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    networks:
      - synapse_default
      - danbooru_default
      - fourier-redis_net
    # No host port published -- Danbooru's nginx reaches it internally as
    # http://fourier-auth:8010 over danbooru_default.
networks:
  synapse_default:
    external: true
  danbooru_default:
    external: true
  fourier-redis_net:
    external: true
